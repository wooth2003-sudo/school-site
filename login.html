<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오름예술고등학교 로그인</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .login-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 16px 100px;
    }

    .login-title {
      font-size: 56px;
      font-weight: 800;
      margin: 0 0 90px;
      color: #222;
    }

    .login-line {
      width: 100%;
      height: 4px;
      background: #78a9b7;
      margin-bottom: 36px;
    }

    .login-form {
      width: 100%;
    }

    .login-input {
      width: 100%;
      height: 96px;
      border: 1px solid #d9d9d9;
      background: #fff;
      padding: 0 28px;
      font-size: 28px;
      color: #222;
      margin-bottom: 24px;
      outline: none;
    }

    .login-input::placeholder {
      color: #9a9a9a;
    }

    .login-btn {
      width: 100%;
      height: 96px;
      border: none;
      background: #78a9b7;
      color: #fff;
      font-size: 34px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 18px;
    }

    .login-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      margin-top: 42px;
      font-size: 22px;
      color: #555;
      flex-wrap: wrap;
    }

    .login-links a {
      color: #555;
      text-decoration: none;
      padding: 0 28px;
    }

    .login-links .divider {
      color: #d0d0d0;
    }

    /* ===== 접속 연출 오버레이 ===== */
    .access-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999;
      overflow: hidden;
      font-family: Consolas, Monaco, monospace;
      color: #00ff66;
    }

    .access-overlay.show {
      display: block;
    }

    /* 붉은 퍼짐 */
    .access-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(255, 0, 0, 0.12),
        rgba(0, 0, 0, 0.96) 72%
      );
      pointer-events: none;
    }

    /* 노이즈 + CRT 느낌 */
    .access-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          transparent 3px,
          transparent 6px
        );
      opacity: 0.45;
      animation: noise 0.08s infinite alternate;
      pointer-events: none;
    }

    .hack-window {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(92vw, 980px);
      min-height: min(82vh, 760px);
      transform: translate(-50%, -50%);
      border: 4px solid #ff2b5f;
      box-shadow:
        0 0 10px rgba(255, 43, 95, 0.95),
        0 0 28px rgba(255, 43, 95, 0.55),
        inset 0 0 18px rgba(255, 43, 95, 0.1);
      background: #000;
      z-index: 2;
      animation: screenShake 0.16s infinite alternate;
    }

    .hack-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 3px solid #ff2b5f;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(255, 0, 60, 0.08);
    }

    .access-title {
      color: #ff2b5f;
      text-shadow: 0 0 10px rgba(255, 43, 95, 0.9);
    }

    .hack-status {
      color: #ff5f87;
      text-shadow: 0 0 8px rgba(255, 43, 95, 0.7);
      animation: warningBlink 0.8s infinite;
    }

    .hack-body {
      padding: 30px 34px 38px;
      min-height: 620px;
      position: relative;
    }

    .terminal-line {
      font-size: clamp(18px, 1.8vw, 28px);
      line-height: 1.65;
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.28);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 14px;
      opacity: 0;
    }

    .terminal-line.show {
      opacity: 1;
    }

    .terminal-line.warning {
      color: #ff5858;
      text-shadow: 0 0 10px rgba(255, 70, 70, 0.5);
      animation: warningBlink 0.65s infinite;
    }

    .terminal-line.dim {
      color: #71ffab;
      opacity: 0.9;
    }

    .terminal-line.live-feed {
      color: #ff1a1a;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.95);
      animation: blinkRed 0.55s infinite;
    }

    .divider-line {
      height: 1px;
      background: rgba(255, 43, 95, 0.45);
      box-shadow: 0 0 8px rgba(255, 43, 95, 0.25);
      margin: 18px 0 20px;
      opacity: 0;
    }

    .divider-line.show {
      opacity: 1;
    }

    .caret {
      display: inline-block;
      width: 0.65em;
      height: 1em;
      background: #00ff66;
      margin-left: 6px;
      vertical-align: -0.12em;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
      animation: blink 0.42s infinite;
    }

    .bottom-status {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #41ff8f;
      font-size: 14px;
      letter-spacing: 0.8px;
      opacity: 0;
    }

    .bottom-status.show {
      opacity: 1;
    }

    .status-chip {
      border: 1px solid rgba(255, 43, 95, 0.7);
      padding: 8px 12px;
      color: #ff9ab8;
      box-shadow: 0 0 10px rgba(255, 43, 95, 0.18);
      background: rgba(255, 43, 95, 0.05);
    }

    @keyframes blink {
      50% {
        opacity: 0.15;
      }
    }

    @keyframes blinkRed {
      50% {
        opacity: 0.28;
      }
    }

    @keyframes warningBlink {
      50% {
        opacity: 0.35;
      }
    }

    @keyframes noise {
      from { opacity: 0.28; }
      to { opacity: 0.56; }
    }

    @keyframes screenShake {
      0%   { transform: translate(-50%, -50%) translate(0px, 0px); }
      25%  { transform: translate(-50%, -50%) translate(1px, -1px); }
      50%  { transform: translate(-50%, -50%) translate(-1px, 1px); }
      75%  { transform: translate(-50%, -50%) translate(1px, 1px); }
      100% { transform: translate(-50%, -50%) translate(-1px, 0px); }
    }

    @media (max-width: 768px) {
      .login-page {
        padding: 48px 14px 80px;
      }

      .login-title {
        font-size: 34px;
        margin-bottom: 56px;
      }

      .login-line {
        height: 3px;
        margin-bottom: 22px;
      }

      .login-input {
        height: 74px;
        font-size: 18px;
        padding: 0 18px;
        margin-bottom: 16px;
      }

      .login-btn {
        height: 74px;
        font-size: 24px;
      }

      .login-links {
        margin-top: 28px;
        font-size: 16px;
      }

      .login-links a {
        padding: 0 14px;
      }

      .hack-header {
        font-size: 13px;
        padding: 14px 16px;
      }

      .hack-body {
        padding: 22px 18px 58px;
        min-height: 500px;
      }

      .terminal-line {
        font-size: 17px;
        line-height: 1.75;
      }

      .bottom-status {
        left: 18px;
        right: 18px;
        bottom: 16px;
        font-size: 11px;
        gap: 10px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <h1 class="login-title">로그인</h1>

    <div class="login-line"></div>

    <form class="login-form" onsubmit="login(event)">
      <input id="id" type="text" class="login-input" placeholder="아이디" />
      <input id="pw" type="password" class="login-input" placeholder="비밀번호" />
      <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="login-links">
      <a href="#">회원가입</a>
      <span class="divider">|</span>
      <a href="#">아이디 찾기</a>
      <span class="divider">|</span>
      <a href="#">비밀번호 찾기</a>
    </div>
  </main>

  <div id="accessOverlay" class="access-overlay">
    <div class="hack-window">
      <div class="hack-header">
        <span class="access-title">Accessing: CCTV_ARCHIVE_01</span>
        <span class="hack-status">LIVE SECURITY ACCESS</span>
      </div>

      <div class="hack-body">
        <div id="line1" class="terminal-line"></div>
        <div id="line2" class="terminal-line"></div>
        <div id="line3" class="terminal-line"></div>
        <div id="line4" class="terminal-line warning"></div>
        <div id="divider1" class="divider-line"></div>
        <div id="line5" class="terminal-line dim"></div>
        <div id="line6" class="terminal-line dim"></div>
        <div id="line7" class="terminal-line dim"></div>
        <div id="line8" class="terminal-line dim"></div>
        <div id="line9" class="terminal-line"></div>
        <div id="line10" class="terminal-line warning"></div>
        <div id="line11" class="terminal-line live-feed"></div>

        <div id="bottomStatus" class="bottom-status">
          <span>NODE: ORMS-SEC-01</span>
          <span>AUTH: VERIFIED</span>
          <span class="status-chip">CAM_01 READY</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const correctId = "admin1";
    const correctPw = "admin2";

    function login(event) {
      event.preventDefault();

      const id = document.getElementById("id").value.trim();
      const pw = document.getElementById("pw").value.trim();

      if (id === correctId && pw === correctPw) {
        startHackSequence();
      } else {
        alert("아이디 또는 비밀번호가 틀렸습니다.");
      }
    }

    function typeLine(elementId, text, speed = 14) {
      return new Promise((resolve) => {
        const el = document.getElementById(elementId);
        el.classList.add("show");
        el.innerHTML = "";

        let i = 0;

        function typing() {
          if (i < text.length) {
            const visible = text.slice(0, i + 1);
            el.innerHTML = visible + '<span class="caret"></span>';
            i++;
            setTimeout(typing, speed);
          } else {
            el.innerHTML = text;
            resolve();
          }
        }

        typing();
      });
    }

    function showElement(id) {
      document.getElementById(id).classList.add("show");
    }

    async function startHackSequence() {
      const overlay = document.getElementById("accessOverlay");
      overlay.classList.add("show");

      await typeLine("line1", "> ACCESS GRANTED", 12);
      await delay(100);

      await typeLine("line2", "> DECRYPTING...", 12);
      await delay(100);

      await typeLine("line3", "> CAM_01 OPEN", 12);
      await delay(100);

      await typeLine("line4", "> WARNING: RESTRICTED SECURITY FEED", 12);
      await delay(80);

      showElement("divider1");
      await delay(80);

      await typeLine("line5", "[SYS] archive_node: orm_roof_cam_01", 10);
      await delay(60);

      await typeLine("line6", "[LOG] scanning timestamp index...", 10);
      await delay(60);

      await typeLine("line7", "[LOG] incident markers detected", 10);
      await delay(60);

      await typeLine("line8", "[LOG] loading hidden surveillance stream", 10);
      await delay(60);

      await typeLine("line9", "[AUTH] clearance level accepted", 10);
      await delay(70);

      await typeLine("line10", "[ALERT] unauthorized disclosure prohibited", 10);
      await delay(70);

      await typeLine("line11", "> OPENING LIVE FEED...", 12);
      await delay(250);

      showElement("bottomStatus");
      await delay(750);

      window.location.href = "cctv.html";
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
