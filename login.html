<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오름예술고등학교 로그인</title>

  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #f7f7f7;
    }

    .login-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 16px;
    }

    .login-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 60px;
    }

    .login-line {
      height: 4px;
      background: #78a9b7;
      margin-bottom: 30px;
    }

    .login-input {
      width: 100%;
      height: 80px;
      border: 1px solid #ddd;
      padding: 0 20px;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      height: 80px;
      border: none;
      background: #78a9b7;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .login-links {
      margin-top: 30px;
      text-align: center;
      color: #666;
    }

    .login-links a {
      margin: 0 10px;
      text-decoration: none;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="login-page">
    <h1 class="login-title">로그인</h1>

    <div class="login-line"></div>

    <form onsubmit="login(event)">
      <input id="id" type="text" class="login-input" placeholder="아이디" />
      <input id="pw" type="password" class="login-input" placeholder="비밀번호" />

      <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="login-links">
      <a href="#">회원가입</a> |
      <a href="#">아이디 찾기</a> |
      <a href="#">비밀번호 찾기</a>
    </div>
  </main>

  <script>
    function login(event) {
      event.preventDefault();

      const id = document.getElementById("id").value;
      const pw = document.getElementById("pw").value;

      if (id === "admin1" && pw === "admin2") {
        window.location.href = "cctv.html";
      } else {
        alert("아이디 또는 비밀번호가 틀렸습니다.");
      }
    }
  </script>
</body>
</html>
