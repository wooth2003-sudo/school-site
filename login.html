<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오름예술고등학교 로그인</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .login-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 16px 100px;
    }

    .login-title {
      font-size: 56px;
      font-weight: 800;
      margin: 0 0 90px;
      color: #222;
    }

    .login-line {
      width: 100%;
      height: 4px;
      background: #78a9b7;
      margin-bottom: 36px;
    }

    .login-form {
      width: 100%;
    }

    .login-input {
      width: 100%;
      height: 96px;
      border: 1px solid #d9d9d9;
      background: #fff;
      padding: 0 28px;
      font-size: 28px;
      color: #222;
      margin-bottom: 24px;
      outline: none;
    }

    .login-input::placeholder {
      color: #9a9a9a;
    }

    .login-btn {
      width: 100%;
      height: 96px;
      border: none;
      background: #78a9b7;
      color: #fff;
      font-size: 34px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 18px;
    }

    .login-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      margin-top: 42px;
      font-size: 22px;
      color: #555;
      flex-wrap: wrap;
    }

    .login-links a {
      color: #555;
      text-decoration: none;
      padding: 0 28px;
    }

    .login-links .divider {
      color: #d0d0d0;
    }

    /* ===== 접속 연출 오버레이 ===== */
    .access-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999;
      overflow: hidden;
      font-family: Consolas, Monaco, monospace;
      color: #00ff66;
    }

    .access-overlay.show {
      display: block;
    }

    .access-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,0,0,0.08), rgba(0,0,0,0.92) 70%);
      pointer-events: none;
    }

    .hack-window {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(92vw, 980px);
      min-height: min(82vh, 760px);
      transform: translate(-50%, -50%);
      border: 4px solid #ff2b5f;
      box-shadow:
        0 0 10px rgba(255, 43, 95, 0.9),
        0 0 28px rgba(255, 43, 95, 0.5),
        inset 0 0 20px rgba(255, 43, 95, 0.08);
      background: #000;
      padding: 0;
      z-index: 2;
    }

    .hack-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 3px solid #ff2b5f;
      color: #ff6e95;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(255, 0, 60, 0.08);
    }

    .hack-close {
      color: #ff8aac;
    }

    .hack-body {
      padding: 34px 36px 40px;
      min-height: 620px;
      position: relative;
    }

    .terminal-line {
      font-size: clamp(20px, 2vw, 30px);
      line-height: 1.6;
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0,255,102,0.28);
      white-space: pre-wrap;
      word-break: keep-all;
      margin-bottom: 18px;
      opacity: 0;
    }

    .terminal-line.show {
      opacity: 1;
    }

    .caret {
      display: inline-block;
      width: 0.65em;
      height: 1em;
      background: #00ff66;
      margin-left: 6px;
      vertical-align: -0.12em;
      box-shadow: 0 0 8px rgba(0,255,102,0.8);
      animation: blink 0.55s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.12;
      }
    }

    .scanlines::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
      pointer-events: none;
      mix-blend-mode: screen;
    }

    @media (max-width: 768px) {
      .login-page {
        padding: 48px 14px 80px;
      }

      .login-title {
        font-size: 34px;
        margin-bottom: 56px;
      }

      .login-line {
        height: 3px;
        margin-bottom: 22px;
      }

      .login-input {
        height: 74px;
        font-size: 18px;
        padding: 0 18px;
        margin-bottom: 16px;
      }

      .login-btn {
        height: 74px;
        font-size: 24px;
      }

      .login-links {
        margin-top: 28px;
        font-size: 16px;
      }

      .login-links a {
        padding: 0 14px;
      }

      .hack-header {
        font-size: 14px;
        padding: 14px 16px;
      }

      .hack-body {
        padding: 22px 18px 28px;
        min-height: 500px;
      }

      .terminal-line {
        font-size: 18px;
        line-height: 1.75;
      }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <h1 class="login-title">로그인</h1>

    <div class="login-line"></div>

    <form class="login-form" onsubmit="login(event)">
      <input id="id" type="text" class="login-input" placeholder="아이디" />
      <input id="pw" type="password" class="login-input" placeholder="비밀번호" />
      <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="login-links">
      <a href="#">회원가입</a>
      <span class="divider">|</span>
      <a href="#">아이디 찾기</a>
      <span class="divider">|</span>
      <a href="#">비밀번호 찾기</a>
    </div>
  </main>

  <div id="accessOverlay" class="access-overlay scanlines">
    <div class="hack-window">
      <div class="hack-header">
        <span>Accessing: HIDDEN_SERA</span>
        <span class="hack-close">[X] CLOSE</span>
      </div>

      <div class="hack-body">
        <div id="line1" class="terminal-line"></div>
        <div id="line2" class="terminal-line"></div>
        <div id="line3" class="terminal-line"></div>
        <div id="line4" class="terminal-line"></div>
      </div>
    </div>
  </div>

  <script>
    const correctId = "admin1";
    const correctPw = "admin2";

    function login(event) {
      event.preventDefault();

      const id = document.getElementById("id").value.trim();
      const pw = document.getElementById("pw").value.trim();

      if (id === correctId && pw === correctPw) {
        startHackSequence();
      } else {
        alert("아이디 또는 비밀번호가 틀렸습니다.");
      }
    }

    function typeLine(elementId, text, speed = 18) {
      return new Promise((resolve) => {
        const el = document.getElementById(elementId);
        el.classList.add("show");
        el.innerHTML = "";

        let i = 0;

        function typing() {
          if (i < text.length) {
            const visible = text.slice(0, i + 1);
            el.innerHTML = visible + '<span class="caret"></span>';
            i++;
            setTimeout(typing, speed);
          } else {
            el.innerHTML = text;
            resolve();
          }
        }

        typing();
      });
    }

    async function startHackSequence() {
      const overlay = document.getElementById("accessOverlay");
      overlay.classList.add("show");

      await typeLine("line1", "> ACCESS GRANTED", 22);
      await delay(220);

      await typeLine("line2", "> DECRYPTING...", 20);
      await delay(260);

      await typeLine("line3", "> CAM_01 OPEN", 20);
      await delay(220);

      await typeLine("line4", "> WARNING: CCTV ARCHIVE UNLOCKED", 16);
      await delay(900);

      window.location.href = "cctv.html";
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
