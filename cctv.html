<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCTV ARCHIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Consolas, monospace;
    }

    /* 상단 경고 */
    .warning {
      padding: 20px 10px;
      text-align: center;
      color: #ff2020;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
      border-bottom: 1px solid rgba(255, 0, 0, 0.4);
    }

    /* 전체 영역 */
    .cctv-wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* 각 CCTV 프레임 */
    .cctv-frame {
      position: relative;
      border: 2px solid rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
      background: #000;
      padding: 8px;
    }

    /* REC 표시 */
    .cctv-frame::before {
      content: "● REC   CAMERA";
      position: absolute;
      top: 12px;
      left: 16px;
      color: #ff3333;
      font-size: 14px;
      text-shadow: 0 0 6px #000;
    }

    /* 이미지 */
    .cctv-frame img {
      width: 100%;
      display: block;
      filter: grayscale(1) contrast(1.1) brightness(0.8);
    }

    /* 하단 정보 */
    .caption {
      margin-top: 6px;
      font-size: 12px;
      color: #aaa;
      text-align: right;
    }
  </style>
</head>

<body>

  <div class="warning">
    WARNING · RESTRICTED ACCESS · SECURITY FOOTAGE · DO NOT DISTRIBUTE
  </div>

  <main class="cctv-wrap">

    <!-- 1번 -->
    <div class="cctv-frame">
      <img src="first.png" alt="CCTV 1" />
      <div class="caption">CAM_01 / ARCHIVE_LOG</div>
    </div>

    <!-- 2번 -->
    <div class="cctv-frame">
      <img src="parkjin1.png" alt="CCTV 2" />
      <div class="caption">CAM_01 / ARCHIVE_LOG</div>
    </div>

    <!-- 3번 -->
    <div class="cctv-frame">
      <img src="shadow.png" alt="CCTV 3" />
      <div class="caption">CAM_04 / UNKNOWN_ENTITY</div>
    </div>

  </main>
  <audio id="bgm" src="ho.mp3" loop></audio>

<script>
window.onload = () => {
  const bgm = document.getElementById("bgm");
  bgm.play().catch(() => {});
};
</script>

</body>
</html>
