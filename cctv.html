<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCTV ARCHIVE</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Consolas, monospace;
    }

    .warning {
      padding: 20px 10px;
      text-align: center;
      color: #ff2020;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
      border-bottom: 1px solid rgba(255, 0, 0, 0.4);
    }

    .cctv-wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .cctv-frame {
      position: relative;
      border: 2px solid rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
      background: #000;
      padding: 8px;
    }

    .cctv-frame::before {
      content: "● REC   CAMERA";
      position: absolute;
      top: 12px;
      left: 16px;
      color: #ff3333;
      font-size: 14px;
      text-shadow: 0 0 6px #000;
    }

    .cctv-frame img {
      width: 100%;
      display: block;
      filter: grayscale(1) contrast(1.1) brightness(0.8);
    }

    .caption {
      margin-top: 6px;
      font-size: 12px;
      color: #aaa;
      text-align: right;
    }

    .sound-btn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 999;
      background: #111;
      color: #ff3333;
      border: 1px solid #ff3333;
      padding: 10px 14px;
      cursor: pointer;
      font-family: Consolas, monospace;
    }
  </style>
</head>

<body>
  <div class="warning">
    WARNING · RESTRICTED ACCESS · SECURITY FOOTAGE · DO NOT DISTRIBUTE
  </div>

  <main class="cctv-wrap">
    <div class="cctv-frame">
      <img src="first.png" alt="CCTV 1" />
      <div class="caption">CAM_01 / ARCHIVE_LOG</div>
    </div>

    <div class="cctv-frame">
      <img src="parkjin1.png" alt="CCTV 2" />
      <div class="caption">CAM_01 / ARCHIVE_LOG</div>
    </div>

    <div class="cctv-frame">
      <img src="shadow.png" alt="CCTV 3" />
      <div class="caption">CAM_04 / UNKNOWN_ENTITY</div>
    </div>
  </main>

  <audio id="bgm" src="ho.mp3" loop></audio>
  <button class="sound-btn" onclick="playBgm()">SOUND ON</button>

  <script>
    function playBgm() {
      const bgm = document.getElementById("bgm");
      bgm.volume = 0.3;
      bgm.play();
    }

    window.addEventListener("load", () => {
      const bgm = document.getElementById("bgm");
      bgm.volume = 0.3;
      bgm.play().catch(() => {
        console.log("브라우저가 자동재생을 막았습니다. SOUND ON 버튼을 눌러주세요.");
      });
    });
  </script>
</body>
</html>
