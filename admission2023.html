<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .page {
      width: 980px;
      margin: 40px auto;
    }

    .breadcrumb {
      text-align: right;
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .breadcrumb span {
      color: #0066cc;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 30px;
      font-weight: 700;
      color: #5a4428;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      border-top: 2px solid #555;
      font-size: 14px;
    }

    .detail-table th {
      width: 100px;
      background: #fafafa;
      border-bottom: 1px solid #ddd;
      border-right: 1px solid #ddd;
      padding: 14px;
      text-align: center;
      font-weight: 700;
    }

    .detail-table td {
      border-bottom: 1px solid #ddd;
      padding: 14px 18px;
    }

    .content-label {
      width: 100px;
      background: #fafafa;
      border-right: 1px solid #ddd;
      text-align: center;
      font-weight: 700;
      vertical-align: top;
      padding-top: 20px;
    }

    .content-box {
      padding: 30px 40px 60px;
      min-height: 500px;
    }

    .content-box h2 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 35px;
    }

    .content-box p {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .admission-img {
      display: block;
      max-width: 720px;
      width: 100%;
      margin: 0 auto 40px;
      border: 1px solid #ddd;
    }

    .date {
      text-align: center;
      font-size: 18px;
      margin-top: 50px;
    }

    .school {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="page">

            </p>

            <img src="2023a.png" alt="2023년 1학년들의 나의 각오" class="admission-img">

            <div class="date">2023. 3. 2</div>

            <div class="school">
              서울예술고등학교
