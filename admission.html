<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>신입생 입학 안내</title>
  <style>
    body {
      margin: 40px;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #fff;
    }

    .board {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color: #111;
    }

    .board th {
      padding: 14px 8px;
      border-top: 2px solid #555;
      border-bottom: 1px solid #ccc;
      font-weight: 700;
      text-align: center;
      background: #f8f8f8;
    }

    .board td {
      padding: 13px 8px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    .board .title {
      text-align: left;
      padding-left: 10px;
    }

    .notice {
      color: #fff;
      background: #2d6cdf;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      display: inline-block;
    }

    .title a {
      text-decoration: none;
      color: #111;
    }

    .title a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<table class="board">
  <thead>
    <tr>
      <th>번호</th>
      <th>제목</th>
      <th>작성자</th>
      <th>작성일</th>
      <th>조회수</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td><span class="notice">공지</span></td>

      <td>정**</td>

      <td>정**</td>

    <tr>

</html>
